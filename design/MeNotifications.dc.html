<!doctype html>
<html lang="ko">
<head>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="k-screen">
  <nav class="k-nav" aria-label="뒤로">
    <a href="Me.dc.html"><span class="k-chev k-chev--back"></span>내 정보</a>
  </nav>
  <header class="k-large k-large--push"><h1>알림 설정</h1></header>
  <p class="k-lead">학교 이메일로 알림을 보내드려요. 바꾸면 바로 저장돼요.</p>
  <main class="k-main">
    <h2 class="k-head" style="margin-top:0">이메일 알림</h2>
    <div class="k-card">
      <div class="k-row" style="min-height:72px">
        <div class="k-grow"><div class="k-t k-strong" id="n1">식사 신청 마감 알림</div><div class="k-cap">마감 3시간 전, 미응답 끼니가 있을 때</div></div>
        <button class="k-switch" type="button" role="switch" aria-checked="true" aria-labelledby="n1"></button>
      </div>
      <div class="k-row" style="min-height:72px">
        <div class="k-grow"><div class="k-t k-strong" id="n2">투표 시작 알림</div><div class="k-cap">새 메뉴 투표가 열렸을 때</div></div>
        <button class="k-switch" type="button" role="switch" aria-checked="true" aria-labelledby="n2"></button>
      </div>
      <div class="k-row" style="min-height:72px">
        <div class="k-grow"><div class="k-t k-strong" id="n3">내 희망 메뉴 소식</div><div class="k-cap">투표 후보로 선정되거나 결과가 나왔을 때</div></div>
        <button class="k-switch" type="button" role="switch" aria-checked="true" aria-labelledby="n3"></button>
      </div>
      <div class="k-row" style="min-height:72px">
        <div class="k-grow"><div class="k-t k-strong" id="n4">알레르기 주의 알림</div><div class="k-cap">내일 식단에 내 알레르기 성분이 있을 때</div></div>
        <button class="k-switch" type="button" role="switch" aria-checked="false" aria-labelledby="n4"></button>
      </div>
    </div>
  </main>
</div>
</x-dc>
