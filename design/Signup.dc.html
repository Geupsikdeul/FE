<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="k-screen">
  <nav class="k-nav" aria-label="뒤로">
    <a href="Login.dc.html"><span class="k-chev k-chev--back"></span>로그인</a>
  </nav>
  <header class="k-large k-large--push"><h1>회원가입</h1></header>
  <p class="k-lead">학교 이메일로 인증하고 가입해요.</p>
  <main class="k-main">
    <form class="k-card">
      <div class="k-form" style="gap:18px;padding:20px 16px">
        <div class="k-field">
          <label class="k-label" for="email">학교 이메일</label>
          <div class="k-inline">
            <input class="k-input k-input--error" id="email" type="email" value="2308@school.hs.kr" aria-describedby="email-err">
            <button class="k-btn k-btn--tonal k-btn--sm" type="button">인증 메일</button>
          </div>
          <span class="k-help k-help--error" id="email-err">이미 가입된 이메일이에요. 로그인해 주세요.</span>
        </div>
        <div class="k-field">
          <label class="k-label" for="code">인증 코드</label>
          <input class="k-input" id="code" inputmode="numeric" placeholder="메일로 받은 6자리">
        </div>
        <div class="k-pair">
          <div class="k-field">
            <label class="k-label" for="name">실명</label>
            <input class="k-input" id="name">
          </div>
          <div class="k-field">
            <label class="k-label" for="sid">학번</label>
            <input class="k-input" id="sid" inputmode="numeric">
          </div>
        </div>
        <div class="k-field">
          <label class="k-label" for="pw">비밀번호</label>
          <input class="k-input" id="pw" type="password">
          <span class="k-help">8자 이상, 영문·숫자 포함</span>
        </div>
      </div>
    </form>
    <div class="k-actions">
      <button class="k-btn k-btn--block" type="button" disabled>가입하기</button>
      <p class="k-cap k-center" style="margin:4px 0 0">이메일 인증을 마쳐야 가입할 수 있어요.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
