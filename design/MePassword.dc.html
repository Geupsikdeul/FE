<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비밀번호 변경</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="k-screen">
  <nav class="k-nav" aria-label="뒤로">
    <a href="Me.dc.html"><span class="k-chev k-chev--back"></span>내 정보</a>
  </nav>
  <header class="k-large k-large--push"><h1>비밀번호 변경</h1></header>
  <p class="k-lead">8자 이상, 영문과 숫자를 섞어 주세요.</p>
  <main class="k-main">
    <form class="k-card">
      <div class="k-form" style="gap:18px;padding:20px 16px">
        <div class="k-field">
          <label class="k-label" for="cur">현재 비밀번호</label>
          <input class="k-input" id="cur" type="password">
        </div>
        <div class="k-field">
          <label class="k-label" for="new">새 비밀번호</label>
          <input class="k-input" id="new" type="password">
          <span class="k-help k-help--ok">✓ 사용할 수 있어요</span>
        </div>
        <div class="k-field">
          <label class="k-label" for="again">새 비밀번호 확인</label>
          <input class="k-input k-input--error" id="again" type="password" aria-describedby="again-err">
          <span class="k-help k-help--error" id="again-err">새 비밀번호와 달라요.</span>
        </div>
      </div>
    </form>
    <div class="k-actions">
      <button class="k-btn k-btn--block" type="button" disabled>변경하기</button>
    </div>
    <p class="k-cap" style="margin:16px 20px 0">비밀번호를 잊었다면 로그아웃 후 로그인 화면의 <b>비밀번호 찾기</b>를 이용해 주세요.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
