<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>정보 수정</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="k-screen">
  <nav class="k-nav" aria-label="뒤로">
    <a href="Me.dc.html"><span class="k-chev k-chev--back"></span>내 정보</a>
  </nav>
  <header class="k-large k-large--push"><h1>정보 수정</h1></header>
  <p class="k-lead">학년이 바뀌면 학번을 수정해 주세요.</p>
  <main class="k-main">
    <form class="k-card">
      <div class="k-form" style="gap:18px;padding:20px 16px">
        <div class="k-field">
          <label class="k-label" for="email">학교 이메일</label>
          <input class="k-input" id="email" value="2308@school.hs.kr" disabled>
          <span class="k-help">이메일은 바꿀 수 없어요.</span>
        </div>
        <div class="k-field">
          <label class="k-label" for="name">이름</label>
          <input class="k-input" id="name" value="최지민">
        </div>
        <div class="k-field">
          <label class="k-label" for="sid">학번</label>
          <input class="k-input" id="sid" inputmode="numeric" value="3108">
          <span class="k-help k-help--ok">2308 → 3108 · 바꾸면 반별 집계에 바로 반영돼요.</span>
        </div>
      </div>
    </form>
    <div class="k-actions">
      <button class="k-btn k-btn--block" type="button">저장</button>
      <a class="k-btn k-btn--plain k-btn--block k-btn--sm" href="Me.dc.html">취소</a>
    </div>

    <h2 class="k-head" style="margin-top:40px">회원 탈퇴</h2>
    <div class="k-card k-card--pad">
      <p class="k-sec" style="margin:0 0 12px">식사 신청 기록과 희망 메뉴가 모두 삭제돼요. 삭제한 뒤에는 되돌릴 수 없어요.</p>
      <button class="k-btn k-btn--danger k-btn--sm" type="button">탈퇴하기</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
