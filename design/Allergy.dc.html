<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 알레르기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="k-screen">
  <nav class="k-nav" aria-label="뒤로">
    <a href="Me.dc.html"><span class="k-chev k-chev--back"></span>내 정보</a>
  </nav>
  <header class="k-large k-large--push"><h1>내 알레르기</h1></header>
  <p class="k-lead">해당하는 항목을 모두 골라 주세요. 식단표에서 해당 음식을 표시해 드려요.</p>
  <main class="k-main">
    <div class="k-card k-card--pad">
      <div class="k-chips" role="group" aria-label="알레르기 유발 물질">
        <button class="k-chip" type="button" aria-pressed="false"><b>1</b>난류</button>
        <button class="k-chip is-on" type="button" aria-pressed="true"><b>2</b>우유</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>3</b>메밀</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>4</b>땅콩</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>5</b>대두</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>6</b>밀</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>7</b>고등어</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>8</b>게</button>
        <button class="k-chip is-on" type="button" aria-pressed="true"><b>9</b>새우</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>10</b>돼지고기</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>11</b>복숭아</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>12</b>토마토</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>13</b>아황산류</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>14</b>호두</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>15</b>닭고기</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>16</b>쇠고기</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>17</b>오징어</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>18</b>조개류</button>
        <button class="k-chip" type="button" aria-pressed="false"><b>19</b>잣</button>
      </div>
    </div>

    <h2 class="k-head">알레르기가 없다면</h2>
    <div class="k-card k-card--pad">
      <div class="k-chips">
        <button class="k-chip" type="button" aria-pressed="false">해당 없음</button>
      </div>
      <p class="k-cap" style="margin:12px 0 0">“해당 없음”과 아직 등록하지 않은 상태는 달라요. 해당 없음을 고르면 위 항목은 모두 해제돼요.</p>
    </div>
  </main>
  <div class="k-savebar">
    <div class="k-between">
      <span class="k-strong">2개 선택됨</span>
      <span class="k-sec">우유, 새우</span>
    </div>
    <button class="k-btn k-btn--block" type="button">저장</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
