<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>급식 일정 · 급식들 어드민</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body>
<div class="a-shell">
  <aside class="a-side" id="a-side"></aside>
  <main class="a-content">
    <div id="msg" class="a-msg"></div>
    <header class="a-top">
      <div><h1>급식 일정</h1><p>날짜별 조식·석식 운영 여부, 신청 마감 시각, 메뉴를 등록해요. 학생 화면의 식단표·식사 신청에 그대로 보여요.</p></div>
    </header>

    <form class="a-filters" id="rf" autocomplete="off">
      <div class="k-field"><label class="k-label" for="r-from">시작 날짜</label><input class="a-select a-date" type="date" id="r-from" name="from" required></div>
      <div class="k-field"><label class="k-label" for="r-to">끝 날짜</label><input class="a-select a-date" type="date" id="r-to" name="to" required></div>
      <div class="k-field"><span class="k-label">&nbsp;</span>
        <div class="a-actions">
          <button class="k-btn k-btn--sm" type="submit">조회</button>
          <button class="k-btn k-btn--plain k-btn--sm" type="button" data-range="0">오늘부터 2주</button>
          <button class="k-btn k-btn--plain k-btn--sm" type="button" data-range="14">그다음 2주</button>
        </div></div>
    </form>

    <div class="a-split" style="margin-top:0">
      <section class="a-panel a-wide" aria-label="날짜별 일정">
        <div class="a-panel__head"><h2>날짜별 일정 <span class="k-sec" style="font-weight:400" id="r-label"></span></h2>
          <span class="k-cap">마감 시각은 한국 시간</span></div>
        <div class="a-tablewrap">
          <table class="a-table">
            <thead><tr><th>날짜</th><th>조식</th><th>석식</th><th></th></tr></thead>
            <tbody id="rows"><tr><td colspan="4" class="k-sec" style="text-align:center;padding:32px">불러오는 중…</td></tr></tbody>
          </table>
        </div>
      </section>

      <aside class="a-panel a-narrow a-sticky" aria-label="일정 편집" id="ed">
        <div class="a-panel__head"><h2>날짜를 골라 주세요</h2></div>
        <p class="k-sec" style="margin:0">왼쪽 표에서 ‘등록’ 또는 ‘수정’을 누르면 그날의 조식·석식을 편집할 수 있어요.</p>
      </aside>
    </div>
  </main>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/pages/a-shell.js"></script>
<script src="/static/js/pages/a-calendar.js"></script>
</body>
</html>
