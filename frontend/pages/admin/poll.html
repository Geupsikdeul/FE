<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>투표 현황 · 급식들 어드민</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body>
<div class="a-shell">
  <aside class="a-side" id="a-side"></aside>
  <main class="a-content">
    <div id="msg" class="a-msg"></div>
    <nav class="a-back"><a class="k-btn k-btn--plain k-btn--sm" href="/admin/votes"><span class="k-chev k-chev--back"></span>투표 목록</a></nav>
    <header class="a-top">
      <div><h1 id="p-title">투표 현황</h1><p id="p-sub">불러오는 중…</p></div>
      <div class="a-actions" id="p-actions"></div>
    </header>

    <section class="a-tiles" aria-label="투표 요약" id="tiles">
      <div class="a-tile"><div class="k-cap">참여</div><div class="a-num">–</div><div class="k-sec">&nbsp;</div></div>
      <div class="a-tile"><div class="k-cap">마감까지</div><div class="a-num">–</div><div class="k-sec">&nbsp;</div></div>
      <div class="a-tile a-tile--hi"><div class="k-cap" style="color:var(--text)">1위</div><div class="a-num">–</div><div style="color:var(--text)">&nbsp;</div></div>
    </section>

    <div class="a-split">
      <section class="a-panel a-wide" aria-label="선택지별 득표">
        <div class="a-panel__head"><h2>선택지별 득표</h2><span class="k-cap">득표순 · 동점은 공동 순위</span></div>
        <div class="a-list" id="opts"><p class="k-sec" style="margin:0">불러오는 중…</p></div>
      </section>
      <div class="a-narrow a-col">
        <section class="a-panel" aria-label="학년별 참여">
          <div class="a-panel__head"><h2>학년별 참여</h2><span class="k-cap">학년 대상 학생 기준</span></div>
          <div class="a-list" id="grades"><p class="k-sec" style="margin:0">불러오는 중…</p></div>
        </section>
        <section class="a-panel" aria-label="투표 비밀 안내">
          <div class="k-banner" style="margin:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
            <span>관리자도 학생 개인이 어떤 메뉴를 골랐는지는 볼 수 없어요. 참여 여부만 확인할 수 있어요.</span></div>
        </section>
      </div>
    </div>

    <section class="a-panel a-sub" aria-label="미참여 학생">
      <div class="a-panel__head"><h2>미참여 학생 <span class="k-sec" style="font-weight:400" id="nv-count"></span></h2></div>
      <form class="a-filters" id="nv-f">
        <div class="k-field"><label class="k-label" for="nv-g">학년</label>
          <select class="a-select" id="nv-g" name="grade"><option value="">전체</option><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select></div>
        <div class="k-field"><label class="k-label" for="nv-c">반</label>
          <select class="a-select" id="nv-c" name="class_no"><option value="">전체</option></select></div>
      </form>
      <div class="a-tablewrap a-scroll">
        <table class="a-table">
          <thead><tr><th>학번</th><th>이름</th><th>학년·반</th></tr></thead>
          <tbody id="nv"><tr><td colspan="3" class="k-sec" style="text-align:center;padding:32px">불러오는 중…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/pages/a-shell.js"></script>
<script src="/static/js/pages/a-poll.js"></script>
</body>
</html>
