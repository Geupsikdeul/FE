<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>대시보드 · 급식들 어드민</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body>
<div class="a-shell">
  <aside class="a-side" id="a-side"></aside>
  <main class="a-content">
    <div id="msg" class="a-msg"></div>
    <header class="a-top">
      <div><h1>대시보드</h1><p>선택한 날의 조식·석식 예상 인원이에요. 미응답은 식사로 집계해요.</p></div>
      <div class="a-actions">
        <a class="k-iconbtn" id="d-prev" href="/admin" aria-label="이전 날"><span class="k-chev k-chev--back" style="margin:0 0 0 4px"></span></a>
        <a class="k-t k-strong" id="d-label" href="/admin" title="오늘로">&nbsp;</a>
        <a class="k-iconbtn" id="d-next" href="/admin" aria-label="다음 날"><span class="k-chev" style="border-color:var(--primary-text);margin:0 4px 0 0"></span></a>
      </div>
    </header>

    <section class="a-tiles" aria-label="핵심 수치" id="tiles">
      <div class="a-tile"><div class="k-cap">조식 예상 인원</div><div class="a-num">–</div><div class="k-sec">불러오는 중…</div></div>
      <div class="a-tile"><div class="k-cap">석식 예상 인원</div><div class="a-num">–</div><div class="k-sec">불러오는 중…</div></div>
      <div class="a-tile a-tile--hi"><div class="k-cap" style="color:var(--text)">미응답</div><div class="a-num">–</div><div style="color:var(--text)">식사로 집계돼요</div></div>
    </section>

    <div class="a-split">
      <section class="a-panel a-wide" aria-label="일별 예상 인원">
        <div class="a-panel__head">
          <h2>일별 예상 인원 <span class="k-sec" style="font-weight:400" id="chart-range"></span></h2>
          <div class="a-legend"><span><i style="background:var(--primary)"></i>조식</span><span><i style="background:var(--on-primary)"></i>석식</span></div>
        </div>
        <div class="a-chart" id="chart"></div>
        <p class="k-cap" style="margin:16px 0 0" id="chart-cap">막대 아래 숫자는 조식 · 석식 순서예요. 예상 = 식사 + 미응답.</p>
      </section>

      <div class="a-narrow a-col">
        <section class="a-panel" aria-label="학년별 식사 인원">
          <div class="a-panel__head"><h2>학년별 식사 인원</h2><span class="k-cap" id="grade-cap"></span></div>
          <div class="a-list" id="grades"><p class="k-sec" style="margin:0">불러오는 중…</p></div>
          <div class="a-legend" style="margin-top:16px"><span><i style="background:var(--primary)"></i>조식</span><span><i style="background:var(--on-primary)"></i>석식</span></div>
        </section>
        <section class="a-panel" aria-label="진행 중인 투표">
          <div class="a-panel__head"><h2>진행 중인 투표</h2><a class="k-btn k-btn--plain k-btn--sm" href="/admin/votes">전체 보기</a></div>
          <div id="polls"><p class="k-sec" style="margin:0">불러오는 중…</p></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/pages/a-shell.js"></script>
<script src="/static/js/pages/a-dashboard.js"></script>
</body>
</html>
