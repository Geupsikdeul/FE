<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>희망 메뉴 · 급식들 어드민</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body>
<div class="a-shell">
  <aside class="a-side" id="a-side"></aside>
  <main class="a-content">
    <div id="msg" class="a-msg"></div>
    <header class="a-top">
      <div><h1>희망 메뉴</h1><p>학생들이 신청한 메뉴와 좋아요 수예요. 작성자는 학년만 보여요. AI로 묶어 보고 투표 후보를 뽑을 수 있어요.</p></div>
      <div class="a-actions">
        <button class="k-btn k-btn--tonal k-btn--sm" type="button" id="ai-cand">AI 투표 후보</button>
        <button class="k-btn k-btn--tonal k-btn--sm" type="button" id="ai-rec">AI 새 메뉴 추천</button>
      </div>
    </header>
    <div class="a-split" style="margin-top:0">
      <section class="a-panel a-wide" aria-label="희망 메뉴 목록">
        <div class="a-panel__head"><h2>신청된 메뉴 <span class="k-sec" style="font-weight:400" id="count"></span></h2><span class="k-cap">좋아요순</span></div>
        <div class="a-tablewrap">
          <table class="a-table">
            <thead><tr><th class="num">순위</th><th>메뉴</th><th>사유</th><th>작성</th><th class="num">좋아요</th><th></th></tr></thead>
            <tbody id="rows"><tr><td colspan="6" class="k-sec" style="text-align:center;padding:32px">불러오는 중…</td></tr></tbody>
          </table>
        </div>
      </section>
      <aside class="a-panel a-narrow a-sticky" aria-label="AI 결과" id="ai">
        <div class="a-panel__head"><h2>AI 도우미</h2></div>
        <p class="k-sec" style="margin:0">위 버튼을 누르면 Claude가 희망 메뉴를 같은 음식끼리 묶어 투표 후보를 고르거나, 학생 알레르기 집계(5명 이상인 성분만)를 고려해 새 메뉴를 추천해요. 10~30초 걸릴 수 있어요.</p>
      </aside>
    </div>
  </main>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/pages/a-shell.js"></script>
<script src="/static/js/pages/a-wishes.js"></script>
</body>
</html>
