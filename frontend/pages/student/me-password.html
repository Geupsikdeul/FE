<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeff4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="급식들">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>비밀번호 변경 · 급식들</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body class="m">
<div class="k-screen">
<nav class="k-nav" aria-label="뒤로" id="back"><a href="/me"><span class="k-chev k-chev--back"></span>내 정보</a></nav>
<header class="k-large k-large--push"><h1>비밀번호 변경</h1></header>
<p class="k-lead">8자 이상, 영문과 숫자를 섞어 주세요.</p>
<main class="k-main">
  <div id="flash"></div>
  <form class="k-card" id="pwform" novalidate>
    <div class="k-form" style="gap:18px;padding:20px 16px">
      <div class="k-field">
        <label class="k-label" for="cur">현재 비밀번호</label>
        <input class="k-input" id="cur" type="password" autocomplete="current-password" maxlength="128" required>
        <span class="k-help k-help--error" id="cur-err" hidden></span>
      </div>
      <div class="k-field">
        <label class="k-label" for="new">새 비밀번호</label>
        <input class="k-input" id="new" type="password" autocomplete="new-password" maxlength="128" required>
        <span class="k-help k-help--error" id="new-err" hidden></span>
      </div>
      <div class="k-field">
        <label class="k-label" for="again">새 비밀번호 확인</label>
        <input class="k-input" id="again" type="password" autocomplete="new-password" maxlength="128" required>
        <span class="k-help k-help--error" id="again-err" hidden></span>
      </div>
    </div>
  </form>
  <div class="k-actions"><button class="k-btn k-btn--block" type="submit" form="pwform" id="submit">변경하기</button></div>
  <p class="k-cap" style="margin:16px 20px 0">비밀번호를 잊었다면 담당 선생님께 임시 비밀번호를 받으세요.</p>
</main>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/pages/s-common.js"></script>
<script src="/static/js/pages/s-me-password.js"></script>
</body>
</html>
