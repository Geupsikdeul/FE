<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeff4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="급식들">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>식단표 · 급식들</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body class="m">
<div class="k-screen">
<header class="k-large"><h1>식단표</h1></header>
<p class="k-lead">날짜별 조식·석식 메뉴를 확인해요.</p>
<main class="k-main">
  <div id="flash"></div>
  <div class="k-between" style="padding:0 16px 12px">
    <a class="k-iconbtn" id="prev" href="/menu" aria-label="이전 날"><span class="k-chev k-chev--back" style="margin:0 0 0 4px"></span></a>
    <a class="k-t k-strong" id="day" href="/menu" title="오늘로"></a>
    <a class="k-iconbtn" id="next" href="/menu" aria-label="다음 날"><span class="k-chev" style="border-color:var(--primary-text);margin:0 4px 0 0"></span></a>
  </div>
  <div class="k-segwrap">
    <div class="k-seg k-seg--full" role="group" aria-label="끼니 선택" id="slots"></div>
  </div>
  <div class="k-card" id="content"></div>
  <p class="k-cap" id="note" style="margin:12px 32px 0"></p>
</main>
<div class="k-dock" id="dock"></div>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/pages/s-common.js"></script>
<script src="/static/js/pages/s-menu.js"></script>
</body>
</html>
