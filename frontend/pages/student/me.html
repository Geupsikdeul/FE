<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeff4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="급식들">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>내 정보 · 급식들</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body class="m">
<div class="k-screen">
<header class="k-large"><h1>내 정보</h1></header>
<p class="k-lead">계정 정보를 확인해요.</p>
<main class="k-main">
  <div id="flash"></div>
  <div class="k-card" id="account"></div>

  <h2 class="k-head">설정</h2>
  <div class="k-card">
    <a class="k-row" href="/allergy"><span class="k-grow k-t">내 알레르기</span><span class="k-sec" id="allergy-sum"></span><span class="k-chev"></span></a>
    <a class="k-row" href="/me-password"><span class="k-grow k-t">비밀번호 변경</span><span class="k-chev"></span></a>
    <button class="k-row" type="button" id="logout"><span class="k-grow k-t" style="color:var(--danger-text)">로그아웃</span></button>
  </div>

  <h2 class="k-head">개인정보</h2>
  <div class="k-card k-card--pad">
    <p class="k-cap" style="margin:0">수집 항목: 학번, 이름, 학년, 반 · 이용 목적: 본인 확인, 조식·석식 신청 집계, 메뉴 투표 참여 확인 · 보존 기간: 학년도 종료 후 3개월. 투표에서 누가 무엇을 골랐는지는 선생님도 볼 수 없어요.</p>
    <p class="k-cap" style="margin:8px 0 0">이름·학번 수정이나 탈퇴는 담당 선생님께 문의해 주세요.</p>
  </div>
</main>
<div class="k-dock" id="dock"></div>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/pages/s-common.js"></script>
<script src="/static/js/pages/s-me.js"></script>
</body>
</html>
