<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeff4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="급식들">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>내 알레르기 · 급식들</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body class="m">
<div class="k-screen">
<nav class="k-nav" aria-label="뒤로"><a href="/me"><span class="k-chev k-chev--back"></span>내 정보</a></nav>
<header class="k-large k-large--push"><h1>내 알레르기</h1></header>
<p class="k-lead">해당하는 항목을 모두 골라 주세요. 식단표에서 해당 음식을 표시해 드려요.</p>
<main class="k-main">
  <div id="flash"></div>
  <div class="k-card k-card--pad"><div class="k-chips" role="group" aria-label="알레르기 유발 물질" id="chips"></div></div>
  <h2 class="k-head">알레르기가 없다면</h2>
  <div class="k-card k-card--pad">
    <div class="k-chips"><button class="k-chip" type="button" aria-pressed="false" id="none">해당 없음</button></div>
    <p class="k-cap" style="margin:12px 0 0">“해당 없음”과 아직 등록하지 않은 상태는 달라요. 해당 없음을 고르면 위 항목은 모두 해제돼요.</p>
  </div>
</main>
<div class="k-savebar">
  <div class="k-between"><span class="k-strong" id="sel-count">불러오는 중…</span><span class="k-sec" id="sel-names"></span></div>
  <button class="k-btn k-btn--block" type="button" id="save" disabled>저장</button>
</div>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/pages/s-common.js"></script>
<script src="/static/js/pages/s-allergy.js"></script>
</body>
</html>
